services:
  - type: web
    name: nave-de-agentes-api
    runtime: node
    # No repositório do portfólio a nave fica em nave-de-agentes/; no Render, Blueprint Path = nave-de-agentes/render.yaml
    rootDir: nave-de-agentes
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @nave/server start
    healthCheckPath: /api/saude
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODELO_AO_VIVO
        value: claude-sonnet-5-5
      - key: COTA_DIA
        value: "5"
      - key: COTA_VISITANTE
        value: "3"
      - key: ORIGEM_PERMITIDA
        sync: false
      - key: NODE_VERSION
        value: "24"
